<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Deepfake Detection</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app-shell-slot"></div>

  <script type="module">
    import { initAppShell } from '/js/app-shell.js';
    import { getDashboardStats, listPredictions, logAction } from '/js/api.js';
    import { showToast } from '/js/notify.js';
    import Chart from 'chart.js/auto';

    const guard = await initAppShell();
    const main = document.getElementById('main-content');
    main.innerHTML = `
      <div class="page-header">
        <h1>Forensic Dashboard</h1>
        <p>Welcome back, ${escapeHtml(guard.profile?.full_name || guard.user.email)}. Here's your detection overview.</p>
      </div>

      <div class="cards-grid">
        <div class="glass metric-card primary">
          <div class="label-row"><span class="label">Total Uploads</span><div class="icon-box">≡</div></div>
          <div class="value" id="stat-total">—</div>
          <div class="delta">All-time analyses</div>
        </div>
        <div class="glass metric-card danger">
          <div class="label-row"><span class="label">AI Generated</span><div class="icon-box">⚠</div></div>
          <div class="value" id="stat-ai">—</div>
          <div class="delta">Detected as synthetic</div>
        </div>
        <div class="glass metric-card accent">
          <div class="label-row"><span class="label">Original Files</span><div class="icon-box">✓</div></div>
          <div class="value" id="stat-human">—</div>
          <div class="delta">Authentic media</div>
        </div>
        <div class="glass metric-card warning">
          <div class="label-row"><span class="label">Avg Confidence</span><div class="icon-box">%</div></div>
          <div class="value" id="stat-conf">—</div>
          <div class="delta">Mean confidence score</div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="glass chart-card">
          <h3>Distribution</h3>
          <div class="chart-container"><canvas id="chart-pie"></canvas></div>
        </div>
        <div class="glass chart-card">
          <h3>Activity (Last 7 Days)</h3>
          <div class="chart-container"><canvas id="chart-line"></canvas></div>
        </div>
      </div>

      <div class="glass table-card">
        <div class="table-head">
          <h3>Recent Uploads</h3>
          <a href="/upload.html" class="btn btn-ghost" style="padding:8px 16px;font-size:13px;">New Detection</a>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>File</th><th>Type</th><th>Verdict</th><th>Confidence</th><th>Date</th><th>Model</th><th></th></tr></thead>
            <tbody id="recent-body"><tr><td colspan="6" style="text-align:center;color:var(--muted);">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    `;

    try {
      const stats = await getDashboardStats();
      document.getElementById('stat-total').textContent = stats.total;
      document.getElementById('stat-ai').textContent = stats.aiCount;
      document.getElementById('stat-human').textContent = stats.humanCount;
      document.getElementById('stat-conf').textContent = stats.avgConf + '%';

      // Pie chart
      new Chart(document.getElementById('chart-pie'), {
        type: 'doughnut',
        data: {
          labels: ['AI Generated', 'Original / Human'],
          datasets: [{
            data: [stats.aiCount, stats.humanCount],
            backgroundColor: ['#FF4B5C', '#00FF88'],
            borderColor: '#050816',
            borderWidth: 2,
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#A0AEC0' } } },
        },
      });

      // Line chart
      new Chart(document.getElementById('chart-line'), {
        type: 'line',
        data: {
          labels: stats.days.map(d => d.date),
          datasets: [{
            label: 'Detections',
            data: stats.days.map(d => d.count),
            borderColor: '#00F5FF',
            backgroundColor: 'rgba(0,245,255,0.1)',
            fill: true, tension: 0.4, pointBackgroundColor: '#00F5FF',
          }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#A0AEC0' } } },
          scales: {
            x: { ticks: { color: '#A0AEC0' }, grid: { color: 'rgba(255,255,255,0.05)' } },
            y: { ticks: { color: '#A0AEC0' }, grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true },
          },
        },
      });

      // Recent uploads
      const recent = await listPredictions({ limit: 8 });
      const body = document.getElementById('recent-body');
      if (recent.length === 0) {
        body.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--muted);">No analyses yet. <a href="/upload.html" style="color:var(--primary);">Run your first detection</a>.</td></tr>`;
      } else {
        body.innerHTML = recent.map(p => `
          <tr>
            <td>${escapeHtml(p.filename)}</td>
            <td><span style="text-transform:uppercase;font-size:11px;color:var(--muted);">${p.media_type}</span></td>
            <td><span class="badge ${p.prediction === 'AI GENERATED' ? 'ai' : 'human'}">${p.prediction === 'AI GENERATED' ? 'AI' : 'Human'}</span></td>
            <td>${p.confidence}%</td>
            <td style="font-size:12px;color:var(--muted);">${new Date(p.created_at).toLocaleDateString()}</td>
            <td style="font-size:12px;color:var(--muted);">${escapeHtml(p.model_name || p.model_used || '—')}</td>
            <td><a href="/report.html?id=${p.id}" class="btn btn-ghost" style="padding:6px 12px;font-size:12px;">View</a></td>
          </tr>`).join('');
      }
      await logAction('view_dashboard');
    } catch (err) {
      showToast('Could not load dashboard data: ' + err.message, 'error');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
  </script>
</body>
</html>
